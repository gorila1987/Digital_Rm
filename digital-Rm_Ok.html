  h1 {
    text-align: center;
    font-size: clamp(26px, 6vw, 44px);
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-shadow: 0 3px 8px rgba(0,0,0,.6);
  }
  .sub {
    text-align: center;
    font-style: italic;
    color: #f5d27a;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 14px;
  }
  .col { flex: 1; max-width: 260px; }
  .col.right { margin-left: auto; }
  .col.right h2 { text-align: center; }
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: #f5d27a;
  }
  .btn {
    display: block;
    width: 100%;
    margin-bottom: 14px;
    padding: 14px 10px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #f2a900;
    border: 2px solid #fff3c4;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 1px 3px rgba(0,0,0,.45);
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
    transition: transform .1s, filter .15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active, .btn.aktif { transform: scale(.97); background: #d98f00; }
  .btn.judul {
    background: #8a8a8a;
    border-color: #d0d0d0;
    cursor: default;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    line-height: 1.1;
  }
  .center {
    flex: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 18px;
    color: #f5d27a;
    padding: 10px;
  }
  .reset-wrap { text-align: center; margin-top: 0; }
  .btn.reset {
    display: inline-block;
    width: 180px;
    background: #d81b1b;
    border-color: #ffd0d0;
  }
  .btn.reset:active { background: #a81010; }
  .panel {
    display: none;
    max-width: 420px;
    margin: 20px auto 0;
    background: #1e1b16;
    border: 1px solid #3a352c;
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.55);
  }
  .panel.show { display: block; }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 15px;
    color: #f0e6d6;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .panel-body.tutup { display: none; }
  .row {
    display: grid;
    grid-template-columns: 1fr 14px 90px;
    align-items: center;
    padding: 6px 0;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    color: #b8ae98;
  }
  .row .sep { color: #6b6556; text-align: center; }
  .row .val { color: #8fbf7a; text-align: center; font-weight: bold; }
  .row.total {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;
    color: #d9cfb8;
    margin: 12px 0;
  }
  .acc {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin-bottom: 10px; padding: 16px 18px;
    background: #e8a53a; color: #1e1b16;
    font-size: 18px; font-weight: bold; text-transform: uppercase;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  .acc-body.tutup { display: none; }
  .r2 {
    display: grid; grid-template-columns: 1fr 14px 150px; align-items: center;
    padding: 6px 0;
    font-family: Arial, Helvetica, sans-serif; font-size: 17px; color: #d9cfb8;
  }
  .r2 .sep { color: #6b6556; text-align: center; }
  .r2 .isi { display: flex; gap: 6px; }
  .r2 input, .r2 select {
    background: #12100d; border: 1px solid #3a352c; border-radius: 8px;
    color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 17px; height: 42px; padding: 0 8px; min-width: 0;
  }
  .r2 input { flex: 1; width: 100%; text-align: center; }
  .r2 select { width: 72px; flex: none; padding: 0 2px; }
  .r2 .tetap {
    width: 72px; flex: none; height: 42px; display: flex; align-items: center; justify-content: center;
    background: #12100d; border: 1px solid #3a352c; border-radius: 8px; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px;
  }
  #panelPakai .r2 { grid-template-columns: 1fr 10px 100px; }
  .r2 select.pil { width: 58px; height: 36px; margin-left: 6px; vertical-align: middle; font-size: 15px; padding: 0 2px; }
  .salin {
    display: inline-block;
    margin-bottom: 12px;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    background: #2e9e4f;
    border: 1px solid #8fe0a8;
    border-radius: 8px;
    cursor: pointer;
  }
  .salin:active { background: #217a3b; }
  .garis { border: 0; border-top: 1px dashed #4a4438; margin: 14px 0; }
  .judul2 { color: #f2a93b; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
  .g {
    display: flex; flex-wrap: nowrap; white-space: nowrap; align-items: center; gap: 4px;
    padding: 5px 0;
    font-family: 'Courier New', monospace; font-size: 14px; color: #b8ae98;
  }
  .g .hasil { margin-left: auto; color: #8fbf7a; font-weight: bold; white-space: nowrap; }
  .g.sum { font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 15px; color: #d9cfb8; }
  .g.sum .hasil { color: #f2a93b; }
  .g input, .g select {
    background: #2a2620; border: 1px solid #4a4438; border-radius: 6px;
    color: #fff; font-size: 14px; padding: 3px 2px;
  }
  .g input { width: 56px; text-align: center; font-weight: bold; }
  .g input.jml { width: 72px; }

  #panelPakai .pk-judul { margin: 16px 0 6px; padding-top: 10px; border-top: 1px dashed #4a4438; text-transform: uppercase; }
  #panelPakai .pk-judul.pertama { border-top: 0; margin-top: 4px; padding-top: 0; }
  #panelPakai .pk-tgl { display: flex; gap: 6px; margin-bottom: 8px; }
  #panelPakai .pk-tgl select, #panelPakai .pk-shift select {
    background: #12100d; border: 1px solid #3a352c; border-radius: 8px; color: #fff;
    font-size: 16px; height: 42px; padding: 0 4px; min-width: 0;
  }
  #panelPakai .pk-tgl .h { flex: 1.3; } #panelPakai .pk-tgl .t { flex: .8; }

  });

  const data = [

    ['Perisai','0'],['Vitas','0'],['Gula ( sistem )','0'],['Gula ( no sistem )','0'],['Minyak Sirkulasi','0']
  ];
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panelBody');
  const panelArrow = document.getElementById('panelArrow');

    '<div class="row' + (d[2] ? ' total' : '') + '"><span>' + d[0] +
    '</span><span class="sep">:</span><span class="val">' + d[1] + '</span></div>'
  ).join('');

  // Rincian Stok Gula/Galus
  const opt = (arr) => arr.map(v => '<option value="' + v + '">' + String(v).replace('.', ',') + '</option>').join('');
  const inpJ = (id) => '<input type="text" class="jml" inputmode="text" autocomplete="off" value="0" id="' + id + '">';
  const inp = (id) => '<input type="number" inputmode="decimal" min="0" step="any" value="0" id="' + id + '">';
  const sel = (id, arr) => '<select id="' + id + '">' + opt(arr) + '</select>';
  const hs = (id) => '<span class="hasil" id="' + id + '">0,000 Kg</span>';
  panelBody.insertAdjacentHTML('beforeend',
    '<hr class="garis">' +
    '<div class="judul2">Rincian Stok Gula/Galus</div>' +
    '<div class="g">Sargul : ' + inp('iSargul') + ' sak &times; ' + sel('sSargul', [45, 46, 47, 48]) + ' =' + hs('rSargul') + '</div>' +
    '<div class="g">L1 : ' + inpJ('iL1') + ' box &times; ' + sel('sL1', [48.75, 34.13]) + ' =' + hs('rL1') + '</div>' +

    '<div class="g">L3 : ' + inpJ('iL3') + ' box &times; 48,742 =' + hs('rL3') + '</div>' +
    '<div class="g">L6 : ' + inpJ('iL6') + ' box &times; ' + sel('sL6', [26.8, 28, 25.2]) + ' =' + hs('rL6') + '</div>' +

    '<hr class="garis">' +
    '<div class="g sum">Jumlah Line :' + hs('tLine') + '</div>' +
    '<div class="g sum">Sargul :' + hs('tSargul') + '</div>' +
    '<div class="g sum">Total :' + hs('tTotal') + '</div>' +
    '<hr class="garis">' +
    '<div class="g sum">Total Gula Kasar : ' + inp('iKasar') + ' sak &times; 50 =' + hs('tKasar') + '</div>' +
    '<div class="g sum">Total Galus &amp; Sargul :' + hs('tGalus') + '</div>' +
    '<div class="g sum">Jumlah Total :' + hs('tJumlah') + '</div>'
  );
  const nilai = (id) => parseFloat(document.getElementById(id).value) || 0;
  // Jumlah dari isian yang boleh berisi penjumlahan, contoh: 10+5+6+13
  const jumlah = (id) => document.getElementById(id).value
    .replace(/,/g, '.').replace(/\s/g, '').split('+')
    .reduce((s, x) => s + (parseFloat(x) || 0), 0);
  const fmt = (v) => v.toLocaleString('id-ID', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' Kg';
  const tulis = (id, v) => { document.getElementById(id).textContent = fmt(v); };
  let jumlahGula = 0;
  function hitung() {
    const sargul = nilai('iSargul') * nilai('sSargul');
    const l1 = jumlah('iL1') * nilai('sL1');
    const l2 = jumlah('iL2') * 48.75;
    const l3 = jumlah('iL3') * 48.742;
    const l6 = jumlah('iL6') * nilai('sL6');
    const l8 = jumlah('iL8') * nilai('sL8');
    const line = l1 + l2 + l3 + l6 + l8;
    const total = line + sargul;
    const kasar = nilai('iKasar') * 50;
    tulis('rSargul', sargul); tulis('rL1', l1); tulis('rL2', l2);
    tulis('rL3', l3); tulis('rL6', l6); tulis('rL8', l8);
    tulis('tLine', line); tulis('tSargul', sargul); tulis('tTotal', total);
    tulis('tKasar', kasar); tulis('tGalus', total); tulis('tJumlah', kasar + total);
    jumlahGula = kasar + total;

    hitung();
  });

  // Tombol Salin: menyalin seluruh ringkasan sebagai teks
  function teksBaris(el) {
    let out = '';
    el.childNodes.forEach(n => {
      if (n.nodeType === 3) out += n.textContent;
      else if (n.tagName === 'INPUT') out += ' ' + n.value + ' ';
      else if (n.tagName === 'SELECT') out += ' ' + n.options[n.selectedIndex].text + ' ';
      else out += ' ' + n.textContent;
    });
    return out.replace(/\s+/g, ' ').trim();
  }
  function ambilRingkasan() {
    const baris = ['RINGKASAN OTOMATIS — TOTAL STOK AWAL'];
    Array.from(panelBody.children).forEach(el => {
      if (el.classList.contains('row')) {
        const s = el.querySelectorAll('span');
        baris.push(s[0].textContent + ' : ' + s[2].textContent);
      } else if (el.classList.contains('garis')) {
        baris.push('----------------------------');
      } else if (el.classList.contains('g')) {
        baris.push(teksBaris(el));
      } else {
        baris.push(el.textContent.trim());
      }
    });
    return baris.join('\n');
  }
  function salinTeks(teks) {
    const cadangan = () => {
      const t = document.createElement('textarea');
      t.value = teks;
      t.style.position = 'fixed';
      t.style.opacity = '0';
      document.body.appendChild(t);
      t.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
    };
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(teks).catch(cadangan);
    }
    cadangan();
    return Promise.resolve();
  }
  const tombolSalin = document.getElementById('salin');
  tombolSalin.addEventListener('click', () => {
    salinTeks(ambilRingkasan()).then(() => {
      tombolSalin.textContent = 'Tersalin ✓';

    bodyLine1.querySelectorAll('select').forEach(s => { s.selectedIndex = 0; });

  // Menu Line 2 (Gula tetap 48,75)

    }
  }));
  document.getElementById('reset').addEventListener('click', () => {

  });

  // Menu Line 3 (Gula tetap 48,742)

  // Menu Line 6

        if (!ada) return;
        const b = [L.nama];
        L.items.forEach((it, i) => { if (vals[i] > 0) { b.push(it[0] + ' : ' + fn(vals[i])); tambahPremix(it[0], vals[i]); } });

        blok.push(b.join('\n'));
        tPer += per; tVit += vit; tGula += gula;

          const g = it[2].length > 1 ? parseFloat(gv('pk_' + L.id + '_' + i + 'g').value) : it[2][0];
          const per = n * L.per, vit = n * L.vit, gula = n * g;

    '<div class="g">L2 : ' + inpJ('aiL2') + ' box &times; 48,75 =' + hs('arL2') + '</div>' +
    '<div class="g">L3 : ' + inpJ('aiL3') + ' box &times; 48,742 =' + hs('arL3') + '</div>' +
    '<div class="g">L6 : ' + inpJ('aiL6') + ' box &times; ' + sel('asL6', [26.8, 28, 25.2]) + ' =' + hs('arL6') + '</div>' +
    '<div class="g">L8 : ' + inpJ('aiL8') + ' box &times; ' + sel('asL8', [26.8, 28, 25.2]) + ' =' + hs('arL8') + '</div>' +
    '<hr class="garis">' +
    '<div class="g sum">Jumlah Line :' + hs('atLine') + '</div>' +
    '<div class="g sum">Sargul :' + hs('atSargul') + '</div>' +
    '<div class="g sum">Total :' + hs('atTotal') + '</div>' +
    '<hr class="garis">' +
    '<div class="g sum">Total Gula Kasar : ' + inp('aiKasar') + ' sak &times; 50 =' + hs('atKasar') + '</div>' +
    '<div class="g sum">Total Galus &amp; Sargul :' + hs('atGalus') + '</div>' +
    '<div class="g sum">Jumlah Total :' + hs('atJumlah') + '</div>';
  function hitungAkhir() {
    const sargul = nilai('aiSargul') * nilai('asSargul');
    const l1 = jumlah('aiL1') * nilai('asL1');
    const l2 = jumlah('aiL2') * 48.75;
    const l3 = jumlah('aiL3') * 48.742;
    const l6 = jumlah('aiL6') * nilai('asL6');
    const l8 = jumlah('aiL8') * nilai('asL8');
    const line = l1 + l2 + l3 + l6 + l8;
    const total = line + sargul;
    const kasar = nilai('aiKasar') * 50;
    tulis('arSargul', sargul); tulis('arL1', l1); tulis('arL2', l2);
    tulis('arL3', l3); tulis('arL6', l6); tulis('arL8', l8);
    tulis('atLine', line); tulis('atSargul', sargul); tulis('atTotal', total);
    tulis('atKasar', kasar); tulis('atGalus', total); tulis('atJumlah', kasar + total);
  }
  const KUNCI_AKHIR = 'digitalStokRM_akhir_v1';
  const isianAkhir = () => Array.from(bodyAkhir.querySelectorAll('input, select'));
  const simpanAkhir = () => {
    try { localStorage.setItem(KUNCI_AKHIR, JSON.stringify(isianAkhir().map(e => e.value))); } catch (e) {}
  };
  try {
    const d = JSON.parse(localStorage.getItem(KUNCI_AKHIR) || 'null');
    if (Array.isArray(d)) isianAkhir().forEach((e, i) => { if (d[i] !== undefined) e.value = d[i]; });
  } catch (e) {}
  bodyAkhir.addEventListener('input', () => { hitungAkhir(); simpanAkhir(); });
  bodyAkhir.addEventListener('change', () => { hitungAkhir(); simpanAkhir(); });
  hitungAkhir();
  document.getElementById('headAkhir').addEventListener('click', () => {
    const tutup = bodyAkhir.classList.toggle('tutup');
    document.getElementById('arrowAkhir').innerHTML = tutup ? '&#9660;' : '&#9650;';
  });
  document.getElementById('salinAkhir').addEventListener('click', () => {
    const baris = ['RINGKASAN OTOMATIS — TOTAL STOK AKHIR'];
    Array.from(bodyAkhir.children).forEach(el => {
      if (el.classList.contains('row')) {
        const sp = el.querySelectorAll('span');
        baris.push(sp[0].textContent + ' : ' + sp[2].textContent);
      } else if (el.classList.contains('garis')) {
        baris.push('----------------------------');
      } else if (el.classList.contains('g')) {
        baris.push(teksBaris(el));
      } else {
        baris.push(el.textContent.trim());
      }
    });
    const tb = document.getElementById('salinAkhir');
    salinTeks(baris.join('\n')).then(() => {
      tb.textContent = 'Tersalin ✓';
      setTimeout(() => { tb.textContent = 'Salin'; }, 1500);
    });
  });
  tombol.forEach(b => b.addEventListener('click', () => {
    if (b.textContent.trim() === 'Stok Akhir') {
      panelAkhir.classList.add('show');
      panelAkhir.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      panelAkhir.classList.remove('show');
    }
  }));
  document.getElementById('reset').addEventListener('click', () => {
    panelAkhir.classList.remove('show');
    bodyAkhir.querySelectorAll('input').forEach(i => { i.value = 0; });
    bodyAkhir.querySelectorAll('select').forEach(x => { x.selectedIndex = 0; });
    hitungAkhir();
    try { localStorage.removeItem(KUNCI_AKHIR); } catch (e) {}
  });

  // Rumus Stok Akhir = Stok Awal + Kiriman (WH & FM) - Pemakaian (Hasil Report / Gula ke SPT)
  const KUNCI_STOK = ['Px Mallow', 'Px Choco', 'Px Choco Expor', 'Px Mallow STW', 'Px Choco STW', 'Px Jem STW',
    'Px Brownies Lokal', 'Px Brownies Eksis', 'Px Brownies Vervet', 'Perisai', 'Vitas', 'Gula ( sistem )', 'Gula ( no sistem )'];
  const PREMIX_REPORT = { 'Px Mallow': 'Px adn Marsmallow', 'Px Choco': 'Px adn Chocopie', 'Px Choco Expor': 'Px adn Choco Expor',
    'Px Mallow STW': 'Px adn Marsmallow Stw', 'Px Choco STW': 'Px adn Chocopie Stw', 'Px Jem STW': 'Px adn Jem',
    'Px Brownies Lokal': 'Px adn Brownies Lokal', 'Px Brownies Eksis': 'Px adn Brownies Eksis', 'Px Brownies Vervet': 'Px adn Brownies Vervet' };
  function kirimanNilai(k) {
    if (k === 'Perisai') return rv(bodyKirimWH, 'Perisai/Native Flour');
    if (k === 'Vitas' || k === 'Gula ( sistem )' || k === 'Gula ( no sistem )') return rv(bodyKirimWH, k);
    return rv(bodyKirimFM, k);
  }
  function pemakaianNilai(k) {
    if (k === 'Perisai') return pakaiVals.per;
    if (k === 'Vitas') return pakaiVals.vit;
    if (k === 'Gula ( sistem )') return sumStr(gv('pk_SPT_0').value);
    if (k === 'Gula ( no sistem )') return sumStr(gv('pk_SPT_1').value);
    return pakaiVals.premix[PREMIX_REPORT[k]] || 0;
  }
  function updateStokAkhir() {
    const hasil = {};
    KUNCI_STOK.forEach(k => { hasil[k] = (awalVals[k] || 0) + kirimanNilai(k) - pemakaianNilai(k); });
    bodyAkhir.querySelectorAll('.row').forEach(r => {
      const sp = r.querySelectorAll('span');
      const k = sp[0].textContent.trim();
      if (k in hasil) sp[2].textContent = fs(hasil[k]);
    });
    // Total Gula Kasar (Rincian Stok Akhir) = Gula ( sistem ) Stok Akhir x 50
    gv('aiKasar').value = Math.round(hasil['Gula ( sistem )'] * 1000) / 1000;
    hitungAkhir();
  }
  gv('aiKasar').readOnly = true;
  document.addEventListener('input', updateStokAkhir);
  document.addEventListener('change', updateStokAkhir);
  document.getElementById('reset').addEventListener('click', () => setTimeout(updateStokAkhir, 0));
  updateStokAkhir();

  // Simpan otomatis di browser (hilang hanya jika Reset ditekan)
  const KUNCI = 'digitalStokRM_v1';
  const semuaIsian = () => [
    ...panelBody.querySelectorAll('input, select'),
    ...bodyLine1.querySelectorAll('input, select'),
    ...bodyLine2.querySelectorAll('input, select'),
    ...bodyLine3.querySelectorAll('input, select'),
    ...bodyLine6.querySelectorAll('input, select'),
    ...bodyLine8.querySelectorAll('input, select'),
    ...bodyRM.querySelectorAll('input, select'),
    ...bodyKirimWH.querySelectorAll('input, select'),
    ...bodyKirimFM.querySelectorAll('input, select'),
    ...bodyKirimGula.querySelectorAll('input, select')
  ];
  function simpan() {
    try { localStorage.setItem(KUNCI, JSON.stringify(semuaIsian().map(e => e.value))); } catch (e) {}
  }
  function muat() {
    try {
      const d = JSON.parse(localStorage.getItem(KUNCI) || 'null');
      if (Array.isArray(d)) {
        // Migrasi data lama (baris Px Choco Expor yang sudah dihapus dari Line 2 dan Line 3)
        const hitungEl = (el) => el.querySelectorAll('input, select').length;
        const c0 = hitungEl(panelBody) + hitungEl(bodyLine1);
        const c2 = hitungEl(bodyLine2);
        const c3 = hitungEl(bodyLine3);
        if (d.length === c0 + c2 + 1) {
          d.splice(c0 + 2, 1);
        } else if (d.length === c0 + c2 + c3 + 1) {
          d.splice(c0 + c2 + 2, 1);
        } else if (d.length === c0 + c2 + c3 + hitungEl(bodyLine6) + hitungEl(bodyLine8) + 1) {
          // data lama Line 8 masih punya baris Px Brownies Vervet (dihapus)
          const c8 = c0 + c2 + c3 + hitungEl(bodyLine6);
          d.splice(c8 + 2, 1);
        } else {
          // data tersimpan dari versi sebelumnya: tambah isian baru Gula ( no sistem ) di RM dan Kiriman Dari WH
          const T = semuaIsian().length;
          const nG = hitungEl(bodyKirimGula);
          const mulaiRM = c0 + c2 + c3 + hitungEl(bodyLine6) + hitungEl(bodyLine8);
          const wh0 = T - hitungEl(bodyKirimWH) - hitungEl(bodyKirimFM) - nG;
          if (d.length === T - 1 || d.length === T - 1 - nG) {
            d.splice(wh0 + 3, 0, '');
          } else if (d.length === T - 2 - nG) {
            d.splice(mulaiRM + 18, 0, '');
            d.splice(wh0 + 3, 0, '');
          }
        }
        semuaIsian().forEach((e, i) => { if (d[i] !== undefined) e.value = d[i]; });
      }
    } catch (e) {}
    hitung();
    simpan();
  }
  [panelBody, bodyLine1, bodyLine2, bodyLine3, bodyLine6, bodyLine8, bodyRM, bodyKirimWH, bodyKirimFM, bodyKirimGula].forEach(el => {
    el.addEventListener('input', simpan);
    el.addEventListener('change', simpan);
  });
  document.getElementById('reset').addEventListener('click', () => {
    try { localStorage.removeItem(KUNCI); } catch (e) {}
  });
  muat();
  sinkron();
  updateStokAkhir();

  // Scroll ke atas berhenti di garis judul laman yang sedang dibuka
  (function () {
    const tb = document.createElement('button');
    tb.id = 'btnMenuAtas'; tb.type = 'button'; tb.textContent = '↑ Menu';
    document.body.appendChild(tb);
    let bebas = false;
    const aktif = () => document.querySelector('.panel.show');
    const batas = () => { const p = aktif(); return p ? Math.max(0, p.getBoundingClientRect().top + window.scrollY) : 0; };
    function perbarui() {
      const a = aktif();
      tb.classList.toggle('tampil', !!a);
      tb.textContent = bebas ? '↓ Laman' : '↑ Menu';
    }
    window.addEventListener('scroll', () => {
      if (bebas || !aktif()) return;
      const t = batas();
      if (window.scrollY < t - 1) window.scrollTo(0, t);
    }, { passive: true });
    tb.addEventListener('click', () => {
      if (bebas) { bebas = false; window.scrollTo(0, batas()); }
      else { bebas = true; window.scrollTo({ top: 0, behavior: 'smooth' }); }
      perbarui();
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.btn')) return;
      setTimeout(() => {
        bebas = false; perbarui();
        if (aktif()) window.scrollTo(0, batas());
      }, 0);
    });
    perbarui();
  })();
</script>
</body>
</html>
